# NiryatSafe rules pack: metadata, sources, analytes, markets.
#
# The LIMITS live in limits.csv, one row per rule:  product,substance,market,limit_mg_kg,source  (+ optional form,basis,note)
# A new market or substance is new rows in limits.csv (plus a `markets:` entry for a market), not new code.
#
# Every rule has a `basis`: law | guidance | practice. Only `law` can produce HOLD.
# verified: primary = text read from the official document during the 2026-10-20 review;
#           secondary = confirmed through reputable summaries / reprints, re-check before relying.
meta:
