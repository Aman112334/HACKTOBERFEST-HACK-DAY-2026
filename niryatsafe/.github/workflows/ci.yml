name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -r requirements.txt
      - run: python -m niryatsafe.rulebook check          # validates every row of rules/limits.csv, with line numbers
      - run: python -m unittest discover -s tests -t .    # engine, parser, pipeline, server, Python<->JS parity
      - run: cd web && npm install && npm test && npm run build
